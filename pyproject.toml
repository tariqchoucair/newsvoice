[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "newsvoice"
version = "1.0.0"
description = "Voice and attribution extraction from news text"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Tariq Choucair" }]
keywords = ["quotation extraction", "attribution", "content analysis",
            "computational social science", "news", "spacy"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = ["spacy>=3.7,<4", "pandas>=1.5"]

[project.optional-dependencies]
progress = ["tqdm>=4.60"]
test = ["pytest>=7.0"]

[project.scripts]
newsvoice = "newsvoice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["model: requires a parse and is sensitive to the spaCy model used"]
